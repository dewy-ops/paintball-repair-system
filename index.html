<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paintball Repair System</title>

<style>
body {
  background:#0a0f14;
  color:white;
  font-family:Arial;
  padding:20px;
}

button {
  padding:12px;
  margin:5px;
  background:#1e2a36;
  color:white;
  border:none;
  border-radius:6px;
}

#out {
  margin-top:20px;
  padding:15px;
  background:#111;
  border-radius:6px;
}

table {
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}

td, th {
  border:1px solid #333;
  padding:6px;
}

</style>
</head>

<body>

<h2>🔧 Paintball Repair System</h2>

<b>Select Marker:</b><br>
<button onclick="setMarker('Ion')">Ion</button>
<button onclick="setMarker('Ego 10')">Ego 10</button>
<button onclick="setMarker('SFT')">SFT</button>

<br><br>

<b>Select Issue:</b><br>
<button onclick="startLeak()">Leak</button>
<button onclick="diagnose('nofire')">Won't Fire</button>
<button onclick="diagnose('velocity')">Velocity</button>
<button onclick="diagnose('dropoff')">Drop-off</button>
<button onclick="showDB()">O-Ring Database</button>
<button onclick="startRebuildSteps()">Guided Rebuild</button>

<div id="out"></div>

<script>

let marker = "";
let stepIndex = 0;
let steps = [];

// ==========================
// O-RING DATABASE
// ==========================

const DB = {
Ion: [
["Bolt Tip","015","1","Front bolt","Main seal"],
["Bolt Sail","014","1","Middle bolt","Air movement"],
["Bolt Rear","014","1","Rear bolt","Stability"],
["Reg Seat","Custom","1","Regulator","Pressure seal"]
],

"Ego 10": [
["Bolt Guide","016","1","Rear guide","Barrel seal"],
["Rammer Front","011","2","Front rammer","Air control"],
["Rammer Mid","010","2","Mid rammer","Cycle"],
["Rammer Rear","011","2","Rear rammer","Return seal"],
["LPR Seal","Custom","1","LPR","Pressure control"]
],

SFT: [
["Fire Chamber Front","17/70","1","Front chamber","Primary seal"],
["Fire Chamber Rear","17/90","1","Rear chamber","Primary seal"],
["Bolt Sleeve","015","2","Bolt sleeve","Air seal"]
]
};

// ==========================
// MARKER SELECT
// ==========================

function setMarker(m){
  marker = m;
  document.getElementById("out").innerHTML = "<b>Marker:</b> " + m;
}

// ==========================
// LEAK FLOW
// ==========================

function startLeak(){
  if(!marker){
    alert("Select marker first");
    return;
  }

  document.getElementById("out").innerHTML = `
  <h3>Where is the leak?</h3>
  <button onclick="leak('barrel')">Barrel</button>
  <button onclick="leak('reg')">Reg / ASA</button>
  <button onclick="leak('internal')">Inside marker</button>
  `;
}

function leak(location){

  let result = "<h3>" + marker + " Leak</h3>";

  if(location === "barrel"){

    result += "<b>Fix:</b><br>";

    if(marker === "Ion"){
      result += "• 015 (bolt tip)<br>• 014 (bolt sail)";
      result += drawIon();
    }

    if(marker === "Ego 10"){
      result += "• 016 (bolt guide)";
      result += drawEgo();
    }

    if(marker === "SFT"){
      result += "• 17/70 + 17/90";
      result += drawSFT();
    }
  }

  if(location === "reg"){
    result += "Likely regulator issue / reg seat";
  }

  if(location === "internal"){
    result += "Likely rammer / solenoid seals";
  }

  document.getElementById("out").innerHTML = result;
}

// ==========================
// OTHER ISSUES
// ==========================

function diagnose(issue){

  if(!marker){
    alert("Select marker first");
    return;
  }

  let result = "<h3>" + marker + "</h3>";

  if(issue === "nofire"){
    result += "Check:<br>• Battery<br>• Wiring<br>• Solenoid";
  }

  if(issue === "velocity"){
    result += "Check:<br>• Pressure<br>• Regulator<br>• Seals";
  }

  if(issue === "dropoff"){
    result += "Likely:<br>• Dry seals<br>• Reg issue<br>• Worn O-rings";
  }

  document.getElementById("out").innerHTML = result;
}

// ==========================
// O-RING DATABASE DISPLAY
// ==========================

function showDB(){

  if(!marker){
    alert("Select marker first");
    return;
  }

  let data = DB[marker];

  let html = "<h3>O-Ring Database (" + marker + ")</h3>";
  html += "<table><tr><th>Name</th><th>Size</th><th>Qty</th><th>Location</th><th>Function</th></tr>";

  data.forEach(row=>{
    html += "<tr>";
    row.forEach(col=> html += "<td>" + col + "</td>");
    html += "</tr>";
  });

  html += "</table>";

  document.getElementById("out").innerHTML = html;
}

// ==========================
// GUIDED REBUILD SYSTEM
// ==========================

function startRebuildSteps(){

  if(!marker){
    alert("Select marker first");
    return;
  }

  stepIndex = 0;

  if(marker === "Ion"){
    steps = [
      "Degas marker",
      "Remove body shell",
      "Remove bolt assembly",
      "Replace 015 (tip) O-ring",
      "Replace 014 (sail) O-ring",
      "Lightly grease all O-rings",
      "Reassemble marker",
      "Gas up slowly",
      "Test firing"
    ];
  }

  if(marker === "Ego 10"){
    steps = [
      "Degas marker",
      "Remove bolt (back cap)",
      "Remove rammer",
      "Replace 016 bolt guide O-ring",
      "Replace rammer O-rings",
      "Light grease seals",
      "Clean LPR",
      "Reassemble marker",
      "Gas up slowly",
      "Test firing"
    ];
  }

  if(marker === "SFT"){
    steps = [
      "Degas marker",
      "Remove bolt assembly",
      "Remove fire chamber",
      "Replace 17/70 O-ring",
      "Replace 17/90 O-ring",
      "Grease all seals properly",
      "Reassemble marker",
      "Gas up slowly",
      "Test firing"
    ];
  }

  showStep();
}

function showStep(){
  document.getElementById("out").innerHTML =
    "<h3>Step " + (stepIndex+1) + "</h3>" +
    steps[stepIndex] +
    "<br><br>" +
    "<button onclick='nextStep()'>Next</button>";
}

function nextStep(){
  stepIndex++;

  if(stepIndex >= steps.length){
    document.getElementById("out").innerHTML =
      "<h3>✅ Rebuild Complete</h3>Test marker and check for issues.";
    return;
  }

  showStep();
}

// ==========================
// DIAGRAMS
// ==========================

function drawIon(){
return `
<svg width="300" height="100">
<rect x="10" y="40" width="280" height="20" fill="gray"/>
<circle cx="40" cy="50" r="8" fill="red"/>
<circle cx="200" cy="50" r="8" fill="blue"/>
<text x="10" y="20">015 Tip</text>
<text x="170" y="20">014 Sail</text>
</svg>`;
}

function drawEgo(){
return `
<svg width="300" height="100">
<rect x="10" y="40" width="280" height="20" fill="gray"/>
<circle cx="150" cy="50" r="8" fill="yellow"/>
<text x="120" y="20">016 Guide</text>
</svg>`;
}

function drawSFT(){
return `
<svg width="300" height="100">
<rect x="10" y="40" width="280" height="20" fill="gray"/>
<circle cx="80" cy="50" r="8" fill="orange"/>
<circle cx="220" cy="50" r="8" fill="green"/>
<text x="60" y="20">17/70</text>
<text x="200" y="20">17/90</text>
</svg>`;
}

</script>

</body>
</html>
