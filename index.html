<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paintball Repair System</title>

<!-- PWA Support -->
<link rel="manifest" href="manifest.json">

<style>
body { margin:0; font-family:Arial; background:#0a0f14; color:white; }

.header { background:#111; padding:12px; text-align:center; font-size:18px; }

.tabs { display:flex; background:#1e2a36; }
.tab { flex:1; padding:12px; text-align:center; }
.tab.active { background:#2c3e50; }

.content { padding:15px; }

button {
  padding:10px;
  margin:5px;
  background:#223446;
  color:white;
  border:none;
  border-radius:6px;
}

#out {
  margin-top:15px;
  padding:10px;
  background:#111;
  border-radius:6px;
}
</style>
</head>

<body>

<div class="header">🔧 Paintball Repair System</div>

<div class="tabs">
  <div class="tab" onclick="showTab('diag')">Diagnose</div>
  <div class="tab" onclick="showTab('rebuild')">Rebuild</div>
  <div class="tab" onclick="showTab('db')">Database</div>
  <div class="tab" onclick="showTab('tools')">Tools</div>
</div>

<div class="content">

<div id="diag">
<button onclick="setMarker('Ion')">Ion</button>
<button onclick="setMarker('Ego 10')">Ego 10</button>
<button onclick="setMarker('Ego 11')">Ego 11</button>
<button onclick="setMarker('SFT')">SFT</button>

<br><br>

<button onclick="leak()">Leak</button>
<button onclick="nofire()">No Fire</button>
</div>

<div id="rebuild" style="display:none;">
<button onclick="startSteps()">Start Guided Rebuild</button>
</div>

<div id="db" style="display:none;">
<button onclick="showDB()">View O-Rings</button>
</div>

<div id="tools" style="display:none;">
<button onclick="electronics()">Electronics</button>
</div>

<div id="out"></div>

</div>

<script>

let marker="";
let step=0;
let steps=[];

// TAB
function showTab(t){
  ['diag','rebuild','db','tools'].forEach(id=>{
    document.getElementById(id).style.display="none";
  });
  document.getElementById(t).style.display="block";
}

// MARKER
function setMarker(m){
  marker=m;
  update("Marker: "+m);
}

// DIAG
function leak(){
  if(!marker) return alert("Select marker");

  let out="Leak fix:<br>";

  if(marker==="Ion"){
    out+="015 + 014";
    out+=drawIon();
  }

  if(marker==="Ego 10"||marker==="Ego 11"){
    out+="016";
    out+=drawEgo();
  }

  if(marker==="SFT"){
    out+="17/70 + 17/90";
    out+=drawSFT();
  }

  update(out);
}

function nofire(){
  update("Battery → Trigger → Solenoid");
}

// DATABASE
function showDB(){
  let out="<h3>O-Rings</h3>";

  if(marker==="Ion") out+="015, 014";
  if(marker==="Ego 10") out+="016";
  if(marker==="SFT") out+="17/70, 17/90";

  update(out);
}

// REBUILD STEPS
function startSteps(){

  if(!marker) return alert("Select marker");

  step=0;

  if(marker==="Ion"){
    steps=[
      "Degas",
      "Remove bolt",
      "Replace 015/014",
      "Grease",
      "Reassemble",
      "Test"
    ];
  }

  if(marker==="Ego 10"){
    steps=[
      "Degas",
      "Remove bolt",
      "Replace 016",
      "Clean LPR",
      "Reassemble",
      "Test"
    ];
  }

  showStep();
}

function showStep(){
  document.getElementById("out").innerHTML=
    "<h3>Step "+(step+1)+"</h3>"+steps[step]+
    "<br><br><button onclick='next()'>Next</button>";
}

function next(){
  step++;
  if(step>=steps.length){
    update("✅ Done");
    return;
  }
  showStep();
}

// TOOLS
function electronics(){
  update("Battery → Eyes → Wiring");
}

// DIAGRAMS
function drawIon(){
return `<svg width="250" height="80">
<rect x="10" y="40" width="200" height="10" fill="gray"/>
<circle cx="40" cy="45" r="6" fill="red"/>
<circle cx="150" cy="45" r="6" fill="blue"/>
</svg>`;
}

function drawEgo(){
return `<svg width="250" height="80">
<rect x="10" y="40" width="200" height="10" fill="gray"/>
<circle cx="100" cy="45" r="6" fill="yellow"/>
</svg>`;
}

function drawSFT(){
return `<svg width="250" height="80">
<rect x="10" y="40" width="200" height="10" fill="gray"/>
<circle cx="60" cy="45" r="6" fill="orange"/>
<circle cx="140" cy="45" r="6" fill="green"/>
</svg>`;
}

function update(txt){
  document.getElementById("out").innerHTML=txt;
}

</script>

</body>
</html>
